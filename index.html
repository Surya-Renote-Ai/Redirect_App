<!DOCTYPE html>
<html>
<head>
    <title>Renote Ai</title>

    <script>
        window.onload = function(){

            const userAgent = navigator.userAgent;

            // Android
            if (/android/i.test(userAgent)){
                window.location.href = "https://play.google.com/store/apps/details?id=com.renote";
            }

            // IOS (iPadOS 13+ reports a Mac user agent, so also check for Mac with touch support)
            else if (/iphone|ipod|ipad/i.test(userAgent) ||
                     (/macintosh/i.test(userAgent) && navigator.maxTouchPoints > 1)) {
                window.location.href = "https://apps.apple.com/in/app/renoteai/id6479944118";
            }

            else{
                window.location.href = "https://www.renote.ai/";
            }
        };
    </script>
</head>
<body>

</body>
</html>
